name: pagatu-orden-prod

services:
  postgres-orden:
    image: postgres:16-alpine
    container_name: pagatu-postgres-orden
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - pagatu_orden_data:/var/lib/postgresql/data
    ports:
      - "25434:5432"
    networks:
      - pagatu-orden-int

  pagatu-orden-ms:
    build: .
    restart: unless-stopped
    depends_on:
      postgres-orden:
        condition: service_healthy
    #ports:
    #  - "28082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: pagatu-postgres-orden
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./logs:/app/logs
    networks:
      - pagatu-orden-int

volumes:
  pagatu_orden_data:

networks:
  pagatu-orden-int:
    name: pagatu-orden-int
