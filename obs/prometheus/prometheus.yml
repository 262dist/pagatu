global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "pagatu-microservicios"
    eureka_sd_configs:
      - server: "http://pagatu-eureka:8761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application

  - job_name: "pagatu-config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["pagatu-config:8888"]
        labels:
          application: pagatu-config

  - job_name: "pagatu-eureka"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["pagatu-eureka:8761"]
        labels:
          application: pagatu-eureka
