server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://pagatu-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pagatu-catalogo-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-catalogo-ms
          __path__: /var/log/pagatu-catalogo-ms/*.log
  - job_name: pagatu-orden-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-orden-ms
          __path__: /var/log/pagatu-orden-ms/*.log
  - job_name: pagatu-auth-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-auth-ms
          __path__: /var/log/pagatu-auth-ms/*.log
  - job_name: pagatu-pago-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-pago-ms
          __path__: /var/log/pagatu-pago-ms/*.log

  - job_name: pagatu-keycloak
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-keycloak
          __path__: /var/log/pagatu-keycloak/*.log
  - job_name: pagatu-pago-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-pago-ms
          __path__: /var/log/pagatu-pago-ms/*.log
  - job_name: pagatu-gateway
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-gateway
          __path__: /var/log/pagatu-gateway/*.log
