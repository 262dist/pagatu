site_name: Pagatu
site_url: https://262dist.github.io/pagatu/
repo_url: https://github.com/262dist/pagatu
repo_name: 262dist/pagatu
docs_dir: docs

nav:
  - Inicio: index.md
  - Guía de Proyecto Sello:
      - Guía del proyecto: proyecto-sello/index.md
      - Brief técnico (plantilla): proyecto-sello/brief.md
      - Producto U1 (plantilla-ejemplo): proyecto-sello/u1-producto.md
      - Producto U2 (plantilla-ejemplo): proyecto-sello/u2-producto.md
      - Producto U3 / Producto Final (plantilla-ejemplo): proyecto-sello/u3-producto.md
      - Matriz de competencias (ICACIT): proyecto-sello/matriz-competencias.md
      - Alcance por microservicio: proyecto-sello/alcance-microservicios.md
      - Sistema académico (referencia): proyecto-sello/acad.md
      - Sistema de producción y comercialización (referencia): proyecto-sello/produccion.md
  - Silabos:
      - Silabo 2026-1: silabo_dist_2026_1.md
      - Silabo 2026-2: silabo_dist_2026_2.md
  - I. Sistema distribuido base orientado a producción:
      - S1 - Construcción de un servicio base para un sistema distribuido: sesiones/S01_Construccion_Servicio_Base.md
      - S2 - Gestión centralizada de configuración y ambientes: sesiones/S02_Configuracion_Centralizada_Ambientes.md
      - S3 - Registro, descubrimiento y ejecución concurrente de servicios: sesiones/S03_Registro_Descubrimiento_Ejecucion_Concurrente.md
      - S4 - Punto único de acceso y distribución de tráfico: sesiones/S04_Punto_Unico_Acceso_Distribucion_Trafico.md
      - S5 - Evaluación de la Unidad I: sesiones/S05_Evaluacion_Unidad_1.md
  - II. Sistema distribuido robusto:
      - S12 - Evaluación de la Unidad II: sesiones/S12_Evaluacion_Unidad_2.md
  - III. Validación y consolidación del producto del curso:
      - S15 - Evaluación de la Unidad III: sesiones/S15_Evaluacion_Unidad_3.md

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.magiclink
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
